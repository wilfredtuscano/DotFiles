# ============================================================================
# TMUX CONFIGURATION
# ============================================================================
# Portable XDG-compliant tmux configuration
# 
# Features:
# - Auto-installs TPM (Tmux Plugin Manager) if missing
# - XDG Base Directory compliant (~/.config/tmux/)
# - Catppuccin themed status bar with CPU, RAM, battery, online status, and date/time
# - Vi-style copy mode with rectangle selection
# - Pane navigation (Alt+arrows), window navigation (Shift+arrows)
# - Vim-tmux-navigator for seamless Ctrl+hjkl pane switching
# - Intuitive pane splitting (| and -)
# 
# Usage:
# 1. Copy this file to ~/.config/tmux/tmux.conf
# 2. Start tmux - TPM will auto-install if needed
# 3. Press Ctrl-a + I to install plugins
# ============================================================================

# ============================================================================
# TERMINAL & DISPLAY SETTINGS
# ============================================================================
set-option -sa terminal-overrides ",xterm*:Tc"

# ============================================================================
# PREFIX KEY CONFIGURATION
# ============================================================================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ============================================================================
# BASIC OPTIONS
# ============================================================================
# Mouse ON, deliberately. A common alternative is to set this off and favour native iTerm2
# selection plus Cmd-C. That reasoning does not apply here:
#
#   - nvim sets `opt.mouse = "a"`. With tmux mouse off, iTerm2 keeps the events and nvim never
#     sees them, so click-to-position, drag-to-visual, scroll and click-to-resize all stop
#     working inside the editor for any session running under tmux.
#   - tmux-yank is installed and set-clipboard is external, so a drag-select already copies to
#     the macOS clipboard on release. Cmd-C is not needed to get the same outcome.
#   - scrolling lands in the right place on its own. tmux's default WheelUpPane binding is
#     CONDITIONAL: when the pane is on the alternate screen or the app has requested mouse
#     events, the wheel is forwarded to the app, so nvim and Claude Code scroll themselves; at
#     a shell prompt it runs `copy-mode -e` and scrolls this pane's history, dropping out of
#     copy-mode by itself once you reach the bottom. With mouse off, both cases collapse into
#     iTerm2's buffer, which under tmux holds redraw artifacts rather than command history.
#
# `prefix + [` is NOT conditional. It always opens tmux copy-mode, which can only ever show the
# pane's NORMAL screen, so inside a TUI app it shows the content from before that app started,
# not the app's own output. Scroll apps with the wheel or their own keys; copy-mode is for
# getting at shell output.
#
# Cost of mouse on: a drag selects within a single pane. For a selection spanning panes or
# wrapped lines, hold Option while dragging, which iTerm2 treats as native selection even with
# mouse reporting on.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Forward Option+Arrow (and other modified keys) through to the shell
# so word-wise prompt navigation works inside tmux
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Auto-name session after the basename of the starting directory
set-hook -g session-created 'run-shell "tmux rename-session $(basename \"#{pane_current_path}\")"'

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Pane navigation (no prefix required)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Window navigation (no prefix required)
bind -n S-Left previous-window
bind -n S-Right next-window

# Pane splitting (new pane inherits the current pane's directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window inherits the current pane's directory (so a new terminal opens where you are)
bind c new-window -c "#{pane_current_path}"

# Pane zoom / maximize toggle (prefix + z also works by default).
# When zoomed, a 󰊓 icon appears on the window tab (see catppuccin_window_*_text above).
bind -n M-z resize-pane -Z

# Pane resizing - repeatable: press prefix once, then hold H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================================
# VI MODE & COPY SETTINGS
# ============================================================================
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ============================================================================
# PLUGINS
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

# ============================================================================
# PLUGIN SETTINGS
# ============================================================================

# Catppuccin theme
set -g @catppuccin_status_background "#{@thm_bg}"
set -g @catppuccin_window_status_style "rounded"
# Close each right-side module with a rounded cap so the filled text block does
# not end in a hard square edge. The module template already emits
# #[fg=<module_text_bg>] just before this, so only the background needs setting
# and the cap colour tracks module_text_bg automatically. Deliberately NOT using
# window-status-format's `reverse` trick: reverse is an attribute, and without a
# following #[none] it leaks downstream and inverts every later segment.
set -g @catppuccin_status_right_separator "#[bg=#{E:@thm_bg}]#[fg=#{E:@thm_fg},bg=#{E:@thm_bg}] "
set -g @catppuccin_window_text " #{?window_zoomed_flag,󰊓 ,}#{pane_current_command}"
set -g @catppuccin_window_current_text " #{?window_zoomed_flag,󰊓 ,}#{pane_current_command}"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
set -g @catppuccin_date_time_text " %Y-%m-%d 󰅐 %I:%M %p"
set -g @catppuccin_session_icon " 󰆍 "
set -g @catppuccin_status_module_text_bg "#{E:@thm_surface_0}"

# tmux-cpu: consistent colors for CPU and RAM pills
set -g @cpu_low_bg_color "#{E:@thm_surface_0}"
set -g @cpu_medium_bg_color "#{E:@thm_surface_0}"
set -g @cpu_high_bg_color "#{E:@thm_surface_0}"
set -g @cpu_low_fg_color "#{E:@thm_fg}"
set -g @cpu_medium_fg_color "#{E:@thm_fg}"
set -g @cpu_high_fg_color "#{E:@thm_fg}"
set -g @ram_low_bg_color "#{E:@thm_surface_0}"
set -g @ram_medium_bg_color "#{E:@thm_surface_0}"
set -g @ram_high_bg_color "#{E:@thm_surface_0}"
set -g @ram_low_fg_color "#{E:@thm_fg}"
set -g @ram_medium_fg_color "#{E:@thm_fg}"
set -g @ram_high_fg_color "#{E:@thm_fg}"

# Fixed-width percentages: status-right is right-aligned, so a digit appearing or
# disappearing shifts every segment to its left. Padding removes that jitter.
# The icon already supplies one trailing space, so drop the text option's leading
# space to stop CPU and RAM sitting further out than battery and date.
set -g @catppuccin_cpu_text "#{l:#{cpu_percentage}}"
set -g @cpu_percentage_format "%5.1f%%"
set -g @ram_percentage_format "%5.1f%%"

# Online status icons
set -g @online_icon "ok"
set -g @offline_icon "nok"

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# ============================================================================
# STATUS BAR
# ============================================================================

# Source Catppuccin plugin to enable module system
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# Custom RAM module (Catppuccin has no built-in memory module)
set -g @catppuccin_ctp_memory_text "#{l:#{ram_percentage}}"
set -gF @catppuccin_status_ctp_memory "#[fg=#{E:@thm_green}]#{@catppuccin_status_left_separator}#[fg=#{E:@thm_crust},bg=#{E:@thm_green}]󰘚 #[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}]"
set -ag @catppuccin_status_ctp_memory "#{E:@catppuccin_ctp_memory_text}"
# Match the plugin template: hand the separator the fill colour to draw its cap in,
# otherwise the cap inherits the text foreground and renders light.
set -agF @catppuccin_status_ctp_memory "#[fg=#{E:@thm_surface_0}]#{@catppuccin_status_right_separator}"

set -g status-position top
set -g status-justify "left"
set -g status-left-length 200
set -g status-right-length 150

# Left: session pill -> window tabs
# No trailing space here: @catppuccin_status_right_separator already ends in one.
set -g status-left "#{E:@catppuccin_status_session}"

# Right: online -> CPU -> RAM -> battery (laptop only) -> date/time
# No prefix indicator here on purpose: the Catppuccin session pill on the left
# already flips green to red while the prefix is armed, so a second one is noise.
set -g status-right "#[fg=#{@thm_mauve},bg=#{@thm_bg}]#[fg=#{@thm_crust},bg=#{@thm_mauve}]#{?#{==:#{online_status},ok},󰖩 ,󰖪 }#[fg=#{@thm_mauve},bg=#{@thm_bg}] "
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ctp_memory}"
# No battery module on hosts without battery hardware: the plugin's scripts emit
# "find: '/sys/class/power_supply/*/capacity': No such file or directory" into
# the status bar. Gate the segment on actual hardware.
if-shell 'ls /sys/class/power_supply/BAT* >/dev/null 2>&1 || pmset -g batt 2>/dev/null | grep -q InternalBattery' \
   'set -agF status-right "#{E:@catppuccin_status_battery}"'
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ============================================================================
# INITIALIZE PLUGIN MANAGER
# ============================================================================

# Bootstrap TPM if not installed (XDG compliant)
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
